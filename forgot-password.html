<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Восстановление пароля</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <h1>Восстановление пароля</h1>
        <div class="card" style="margin-top: 14px">
          <form id="reset-form" autocomplete="on" novalidate>
            <label>
              Email аккаунта
              <input name="email" type="email" inputmode="email" required />
            </label>
            <label>
              Новый пароль
              <input name="new_password" type="password" minlength="6" required />
            </label>
            <label>
              Повторите пароль
              <input name="confirm_password" type="password" minlength="6" required />
            </label>

            <div id="form-error" class="alert alert-error" style="display: none"></div>
            <div id="form-success" class="alert alert-success" style="display: none"></div>

            <button id="submit-btn" type="submit">Сменить пароль</button>
          </form>
        </div>

        <p style="margin-top: 12px">
          Вспомнили пароль? <a href="./login.html">Вернуться ко входу</a>
        </p>
      </div>
    </main>
    <script src="./js/main.js" defer></script>
    <script src="./js/forgot-password.js" defer></script>
  </body>
</html>
