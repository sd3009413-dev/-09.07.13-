<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Регистрация</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <h1>Регистрация</h1>
        <div class="card" style="margin-top: 14px">
          <form id="register-form" autocomplete="on" novalidate>
            <label>
              Имя пользователя
              <input name="username" type="text" minlength="3" required />
            </label>
            <label>
              Email
              <input name="email" type="email" inputmode="email" required />
              <small>Введите почту от аккаунта, а не логин.</small>
            </label>
            <label>
              Пароль
              <input name="password" type="password" minlength="6" required />
            </label>
            <label>
              Повтор пароля
              <input name="confirm_password" type="password" minlength="6" required />
            </label>

            <div id="form-error" class="alert alert-error" style="display: none"></div>

            <button id="submit-btn" type="submit">Создать аккаунт</button>
          </form>
        </div>

        <p style="margin-top: 12px">
          Уже есть аккаунт? <a href="./login.html">Войти</a>
        </p>
      </div>
    </main>
    <script src="./js/main.js" defer></script>
    <script src="./js/register.js" defer></script>
  </body>
</html>
